<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Modelo</title>
</head>
<body>
    <section class="container">
        <h1>Tabela IMC</h1>
        <section class="tabela">
            <section>
                <ul>
                    <li class="list-title">IMC</li>
                    <li>Menos do que 18,5</li>
                    <li>Entre 18,5 e 24,9</li>
                    <li>Entre 25 e 29,9</li>
                    <li>Entre 30 e 34,9</li>
                    <li>Entre 35 e 39,9</li>
                    <li>Mais do que 40</li>
                </ul>
            </section>
            <section>
                <ul>
                    <li class="list-title">Resultado</li>
                    <li>Abaixo do peso</li>
                    <li>Peso normal</li>
                    <li>Sobrepeso</li>
                    <li>Obesidade grau 1</li>
                    <li>Obesidade grau 2</li>
                    <li>Obesidade grau 3</li>
                </ul>
            </section>
        </section>
        <h2>Calcule seu IMC</h2>
        <form action="">
            <label for="peso">Peso</label>
            <input type="number" id="peso" name="peso">

            <label for="altura">Altura</label>
            <input type="number" id="altura" name="altura">

            <button id="calcular">Calcular</button>
            <p class="resultado" id="resultado"></p>
        </form>
    </section>
    <script src="assets/js/main.js"></script>
</body>
</html>
